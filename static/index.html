<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusSpace – find a free classroom</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#12343b">
<link rel="icon" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/icon-192.png"><link rel="stylesheet" href="/css/style.css"></head><body>
<header><div><h1>CampusSpace</h1><p>Free classrooms right now · <span id="clock"></span></p></div><a href="/admin">Admin</a></header>
<main>
<section class="filters">
 <input id="q" type="search" placeholder="Room number, e.g. 37" aria-label="Search room number">
 <select id="dept" aria-label="Department"><option value="">All departments</option></select>
 <select id="status" aria-label="Status"><option value="">Any status</option><option>Vacant</option><option>Occupied</option><option>Class Ongoing</option><option>Unverified</option></select>
 <input id="cap" type="number" min="0" placeholder="Min capacity" aria-label="Minimum capacity">
 <button id="vac" class="chip" aria-pressed="false">Vacant only</button>
</section>
<p class="legend"><i class="vacant"></i>Vacant <i class="occupied"></i>Occupied <i class="class-ongoing"></i>Class ongoing <i class="unverified"></i>Unverified</p>
<section id="grid" class="grid" aria-live="polite"></section>
</main>
<dialog id="dlg"></dialog><script src="/js/app.js"></script></body></html>
